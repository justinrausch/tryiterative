<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Iterative</title>
    <meta name="description" content="Contact Iterative - Tell us about yourself and your project ideas">
    <link rel="stylesheet" href="styles.css?v=6">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="vanta-background"></div>
    <div class="grain-overlay"></div>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <a href="index.html" class="logo">
                    <img src="https://ik.imagekit.io/atlht1jbt/Group%202.png" alt="Iterative" class="logo-img">
                </a>
            </div>
            <div class="nav-right">
                <a href="about.html" class="nav-link">ABOUT</a>
                <span class="nav-separator">•</span>
                <a href="team.html" class="nav-link">TEAM</a>
                <span class="nav-separator">•</span>
                <a href="contact.html" class="nav-link active">CONTACT</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="contact-page-container">
            <div class="contact-header">
                <a href="index.html" class="team-back-arrow">←</a>
                <h1 class="contact-title">CONTACT US</h1>
            </div>
            
            <div class="contact-intro">
                <p class="contact-headline">Want to work with us?</p>
                <p class="contact-subtext">Tell us about yourself and your project ideas.</p>
            </div>
            
            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" id="name" name="name" class="form-input" placeholder="Your name" required>
                </div>
                
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="Your email" required>
                </div>
                
                <div class="form-group">
                    <label for="social" class="form-label">Social Media Link</label>
                    <input type="text" id="social" name="social" class="form-input" placeholder="Instagram, Twitter, etc.">
                </div>
                
                <div class="form-group">
                    <label for="message" class="form-label">What else should we know about you?</label>
                    <textarea id="message" name="message" class="form-textarea" placeholder="Tell us about yourself, your ideas, or anything else..." rows="4"></textarea>
                </div>
                
                <button type="submit" class="form-submit" id="submitBtn">
                    <span class="submit-text">Send Message</span>
                </button>
            </form>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>
    <script>
        window.addEventListener('load', function() {
            let vantaEffect = null;
            
            function initVanta() {
                if (typeof VANTA !== 'undefined' && VANTA.WAVES) {
                    vantaEffect = VANTA.WAVES({
                        el: "#vanta-background",
                        mouseControls: true,
                        touchControls: true,
                        gyroControls: false,
                        minHeight: 200.00,
                        minWidth: 200.00,
                        scale: 0.5,
                        scaleMobile: 0.5,
                        color: 0x0a0a0a,
                        shininess: 20.00,
                        waveHeight: 10.00,
                        waveSpeed: 1.50,
                        zoom: 0.15
                    });
                    
                    // Animate zoom on page load
                    setTimeout(() => {
                        const startTime = Date.now();
                        const duration = 2000;
                        const initialZoom = 0.15;
                        const targetZoom = 0.4;
                        
                        function animateZoom() {
                            const elapsed = Date.now() - startTime;
                            const progress = Math.min(elapsed / duration, 1);
                            const easeOut = 1 - Math.pow(1 - progress, 3);
                            
                            const currentZoom = initialZoom + (targetZoom - initialZoom) * easeOut;
                            if (vantaEffect) {
                                if (vantaEffect.setOptions) {
                                    vantaEffect.setOptions({ zoom: currentZoom });
                                } else if (vantaEffect.options) {
                                    vantaEffect.options.zoom = currentZoom;
                                }
                            }
                            
                            if (progress < 1) {
                                requestAnimationFrame(animateZoom);
                            }
                        }
                        
                        requestAnimationFrame(animateZoom);
                    }, 500);
                } else {
                    setTimeout(initVanta, 100);
                }
            }
            
            initVanta();
            
            // Form handling - mailto
            const form = document.getElementById('contactForm');
            const CONTACT_EMAIL = 'hello@talkupapp.com';
            
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const social = document.getElementById('social').value.trim();
                const message = document.getElementById('message').value.trim();
                
                const subject = encodeURIComponent(`[Iterative Contact] New submission from ${name}`);
                const body = encodeURIComponent(
`NEW CONTACT FORM SUBMISSION
============================

FROM: ${name}
REPLY-TO EMAIL: ${email}
SOCIAL MEDIA: ${social || 'Not provided'}

MESSAGE:
${message || 'No additional message provided'}

============================
Submitted via Iterative website contact form
Reply directly to: ${email}`
                );
                
                window.location.href = `mailto:${CONTACT_EMAIL}?subject=${subject}&body=${body}&reply-to=${encodeURIComponent(email)}`;
            });
        });
    </script>
</body>
</html>
